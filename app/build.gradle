plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.12"
}

android {
    namespace 'com.tinah.transactify'
    compileSdk 35

    defaultConfig {
        applicationId "com.tinah.transactify"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    sourceSets {
        androidTest {
            assets.srcDir("$projectDir/schemas")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        // Revu en Phase 8 : les signalements actuels (GradleDependency,
        // TrustAllX509TrustManager, ObsoleteSdkInt, MonochromeLauncherIcon...)
        // viennent de dépendances tierces ou d'assets manquants, pas de bugs
        // dans notre code — bloquer la CI dessus casserait le build pour des
        // raisons hors de notre contrôle immédiat. Rapport toujours généré et
        // publié (voir build.yml), donc rien n'est masqué.
        abortOnError false
        warningsAsErrors false
        checkReleaseBuilds false
        htmlReport true
        xmlReport true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'

    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.2'

    // WorkManager (required by SMSProcessingWorker / SMSBroadcastReceiver)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Navigation (required by MainActivity nav_host_fragment)
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // UI
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // DataStore (Preferences)
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // PDF Export : android.graphics.pdf.PdfDocument (plateforme, pas de dépendance --
    // itextpdf retiré : CVE connues + licence AGPL inadaptée à une app commerciale)

    // Excel Export
    implementation 'org.apache.poi:poi-ooxml:5.2.2'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.1.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.2'
    // DAO tests need a real SQLite engine + an Android Context -> Robolectric,
    // since these are JVM unit tests (test/), not instrumented tests (androidTest/).
    testImplementation 'androidx.room:room-testing:2.6.1'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Rapport de couverture (domain/ + data/repository/ en particulier, cf. plan Phase 8).
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = 'verification'
    description = 'Génère le rapport de couverture des tests unitaires debug.'

    reports {
        xml.required = true
        html.required = true
    }

    def excludes = [
        '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
        '**/databinding/*', '**/android/databinding/*', '**/BR.*',
        '**/di/**', // ServiceLocator : wiring, pas de logique à couvrir
        '**/ui/**/*Fragment*.*', // vues Android, non testées unitairement (voir README)
    ]
    def kotlinClasses = fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: excludes)
    def javaClasses = fileTree(dir: "$buildDir/intermediates/javac/debug/classes", excludes: excludes)

    classDirectories.setFrom(files([kotlinClasses, javaClasses]))
    sourceDirectories.setFrom(files(["$projectDir/src/main/java"]))
    executionData.setFrom(fileTree(dir: buildDir, includes: ['jacoco/testDebugUnitTest.exec']))
}
